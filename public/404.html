<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lifetime Corpus Calculator</title>
    <script>
      // Single Page Application redirect script for static hosts (GitHub Pages, etc.)
      ;(function () {
        var path = window.location.pathname
        var search = window.location.search
        var hash = window.location.hash
        var redirectUrl = window.location.origin + '/?p=' + encodeURIComponent(path + search + hash)
        window.location.replace(redirectUrl)
      })()
    </script>
  </head>
  <body></body>
</html>
